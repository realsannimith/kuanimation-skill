<!doctype html>
<meta charset="utf-8">
<title>My drawtale film</title>
<style>body{margin:0;background:#1b1712;display:grid;place-items:center;min-height:100vh}canvas{max-width:100vw;max-height:100vh}</style>
<canvas id="c"></canvas>
<script src="drawtale.js"></script>
<script src="brush.js"></script>
<script src="stage.js"></script>
<script src="cast.js"></script>
<script src="props.js"></script>
<script src="action.js"></script>
<script src="director.js"></script>
<script src="voice.js" onerror="window.VOICE=[]"></script>
<script src="scenes.js"></script>
<script src="score.js"></script>
<script>
'use strict';
/* BRIEF
Subject:            (what the story shows, who it is for)
Language:           (the voice's language; subtitle line 1 in it, optional line 2 a translation)
Storytelling:       action (default: players act it out, unseen voice-over + subtitles)
                    | presenter (an on-screen narrator such as `grandpa`)
Style:              wash (default: watercolour landscape by day, indigo rain at night)
                    | haze (hazy painted forests) | paper (Paper Diorama) | marker (felt-tip + curtains)
Frame:              stage (the style's frame and ground, default) | full (full-bleed pictures)
Voice-over:         tts_gemini.py (voice, style) | tts_edge.py (voice) | none (captions only)
Duration target:    (comes from the lines + holds; check after the first render)
Scenes:             (one line each: name, backdrop mood, what appears, what moves)
Sources/licences:   (facts, any external media)
*/
const PLAY = buildPlay(SCENES, {
  narrator: null,          // action storytelling; set to `grandpa` for a presenter
  style: 'wash',           // watercolour (indigo rain at night); 'haze' hazy painted animation; 'paper' Paper Diorama; 'marker' felt-tip + curtains
  frame: 'stage',
  end: endCard([{text: 'The End', size: 96, color: T.gold}, {text: 'Made with drawtale', italic: true, size: 30}]),
});
const qs = new URLSearchParams(location.search);
defineFilm({fps: 24, timeline: PLAY, score: typeof score === 'function' && !qs.has('noscore') ? score : null});
</script>
